<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" role="img" aria-label="Wick">
<title>Wick</title>
<style>
.rise{animation:rise 1.4s cubic-bezier(.32,.72,.28,1) backwards}
.l0{animation-delay:.2s} .l1{animation-delay:.35s} .l2{animation-delay:.5s} .l3{animation-delay:.65s}
.lit,.glow,.pool{animation:light 14s ease-in-out infinite}
.dim{animation:dim 14s ease-in-out infinite}
.burn{transform-box:fill-box;transform-origin:50% 100%;animation:burn 14s cubic-bezier(.34,1.2,.64,1) infinite}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.3s ease-in-out infinite}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker 1.9s ease-in-out infinite}
.core{transform-box:fill-box;transform-origin:50% 100%;animation:flicker 2.3s ease-in-out infinite reverse}
.breathe{animation:breathe 3.7s ease-in-out infinite}
.ember{animation:ember 14s ease-in-out infinite}
.smoke{animation:smoke 14s ease-out infinite}
.bead{animation:bead 14s ease-in infinite}
.spark{opacity:0;animation:spark 2.6s ease-out infinite}
.sp1{animation-delay:.9s;animation-duration:3.1s} .sp2{animation-delay:1.7s;animation-duration:2.2s} .sp3{animation-delay:2.4s;animation-duration:3.6s}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@keyframes burn{0%,17%{transform:scale(0)}19.5%{transform:scale(1.14)}22%,85%{transform:scale(1)}88.5%,100%{transform:scale(0)}}
@keyframes light{0%,17%{opacity:0}25%,85%{opacity:1}90%,100%{opacity:0}}
@keyframes dim{0%,17%{opacity:.6}25%,85%{opacity:1}90%,100%{opacity:.6}}
@keyframes ember{0%,6%{opacity:0}14%{opacity:1}17.5%,86%{opacity:0}89%{opacity:1}97%,100%{opacity:0}}
@keyframes smoke{0%,87%{opacity:0;stroke-dashoffset:1;transform:translateY(0)}89%{opacity:.7;stroke-dashoffset:.55}100%{opacity:0;stroke-dashoffset:0;transform:translateY(-30px)}}
@keyframes bead{0%,52%{opacity:0;transform:translateY(0)}55%{opacity:1}80%{opacity:1;transform:translateY(46px)}84%,100%{opacity:0;transform:translateY(46px)}}
@keyframes spark{0%{opacity:0;transform:translate(0,0)}15%{opacity:.9}100%{opacity:0;transform:translate(6px,-58px)}}
@keyframes sway{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}50%{transform:rotate(1.5deg)}75%{transform:rotate(-1deg)}}
@keyframes flicker{0%,100%{transform:scale(1,1)}17%{transform:scale(.95,1.06)}39%{transform:scale(1.03,.96)}61%{transform:scale(.97,1.08)}83%{transform:scale(1.02,.98)}}
@keyframes breathe{0%,100%{opacity:1}30%{opacity:.78}55%{opacity:.94}80%{opacity:.72}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ember,.smoke,.spark,.bead{opacity:0}}
</style>
