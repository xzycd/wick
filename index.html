<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- JS keeps this in sync with the active theme; light is the first-paint default. -->
    <meta name="theme-color" content="#f5eee1" />
    <meta name="description" content="Wick — a candlelit ledger for trials and subscriptions about to renew. Private, local, calm." />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="flame.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="mask-icon" href="flame.svg" color="#c9631f" />

    <!-- iOS / Android "add to home screen" as a standalone app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Wick" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Karla:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <title>Wick — know what's burning down</title>

    <script>
      // Apply the saved (or system) theme before first paint — no flash of the
      // wrong palette, and the mobile status bar matches from the very start.
      try {
        var s = JSON.parse(localStorage.getItem('wick.settings.v1') || '{}')
        var t =
          s.theme && s.theme !== 'auto'
            ? s.theme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = t
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', t === 'dark' ? '#191410' : '#f5eee1')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
